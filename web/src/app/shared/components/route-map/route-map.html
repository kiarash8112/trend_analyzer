@if (layout(); as l) {
  <p class="label">Route · {{ l.start }} to today, spaced by real dates</p>
  <svg
    [attr.viewBox]="'-10 0 ' + (l.width + 20) + ' ' + l.height"
    role="img"
    [attr.aria-label]="'Timeline from ' + l.start + ', ' + l.events.length + ' events'"
  >
    @for (m of l.months; track m.x) {
      <line class="tick" [attr.x1]="m.x" y1="48" [attr.x2]="m.x" y2="146" />
      <text class="month" [attr.x]="m.x + 3" y="212">{{ m.label }}</text>
    }
    <path class="track" [attr.d]="l.path" />
    @for (s of l.stops; track s.x) {
      @if (s.span) {
        <rect
          class="stop"
          [attr.x]="s.x - 9"
          [attr.y]="s.y - 9"
          [attr.width]="s.span + 18"
          height="18"
          rx="9"
        />
      } @else {
        <circle
          [class]="s.now ? 'now' : 'stop'"
          [attr.cx]="s.x"
          [attr.cy]="s.y"
          [attr.r]="s.now ? 11 : 7"
        />
      }
    }
    @for (lb of l.labels; track lb.x) {
      <line class="leader" [attr.x1]="lb.x" [attr.y1]="lb.y1" [attr.x2]="lb.x" [attr.y2]="lb.y2" />
      <text class="event" [attr.x]="lb.x" [attr.y]="lb.y" [attr.text-anchor]="lb.anchor">
        {{ lb.text }}
        <title>{{ lb.full }}</title>
      </text>
      <text class="date" [attr.x]="lb.x" [attr.y]="lb.y + 14" [attr.text-anchor]="lb.anchor">
        {{ lb.date }}
      </text>
    }
  </svg>
  <ol class="vertical">
    @for (e of l.events; track $index) {
      <li>
        <span class="mono">{{ e.date }}</span
        >{{ e.event }}
      </li>
    }
  </ol>
}

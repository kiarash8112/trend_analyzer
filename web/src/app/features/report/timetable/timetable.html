<div class="columns" aria-hidden="true">
  <span>Line</span>
  <span>Repo</span>
  <span>Stars today</span>
  <span>Via (launched on)</span>
  <span>What it is</span>
</div>
@for (row of rows(); track row.result.evidence.repo.url) {
  <app-timetable-row
    [result]="row.result"
    [rank]="row.rank"
    [link]="['/reports', reportName(), 'repos', row.rank]"
  />
}

<div class="row" [class.off]="!insight()" (click)="onRowClick($event)">
  <app-line-roundel
    [number]="rank()"
    [link]="insight() ? link() : null"
    [label]="'Read why ' + repo().owner + '/' + repo().name + ' is trending'"
  />
  <a class="name" [href]="repo().url" target="_blank" rel="noopener">
    <span class="owner">{{ repo().owner }} /</span> {{ repo().name }}
  </a>
  <span class="stars">+{{ repo().stars_in_period | number }}</span>
  <span class="via">
    {{ insight() ? channel() : '—' }}
    <span class="mono">{{ insight()?.launch_date }}</span>
  </span>
  <span class="lead" [class.failed]="!insight()">{{ lead() }}</span>
</div>
